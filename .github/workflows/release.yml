name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-smoke:
    name: Native smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: http_ssh_proxy
          - os: macos-latest
            binary: http_ssh_proxy
          - os: windows-latest
            binary: http_ssh_proxy.exe
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and run native binary
        shell: bash
        run: |
          set -euo pipefail
          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-s -w -X github.com/hightemp/http_ssh_proxy/internal/buildinfo.Version=${GITHUB_REF_NAME} -X github.com/hightemp/http_ssh_proxy/internal/buildinfo.Commit=${GITHUB_SHA} -X github.com/hightemp/http_ssh_proxy/internal/buildinfo.BuildTime=${build_time}"
          go build -trimpath -ldflags="${ldflags}" -o "${{ matrix.binary }}" ./cmd/http_ssh_proxy
          output="$(./${{ matrix.binary }} -version)"
          printf '%s\n' "${output}"
          grep -F "version=${GITHUB_REF_NAME}" <<< "${output}"
          grep -F "commit=${GITHUB_SHA}" <<< "${output}"

  release:
    name: Build, attest, and publish
    needs: native-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify tag and version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ "${version}" == v* ]]; then
            expected_tag="${version}"
          else
            expected_tag="v${version}"
          fi
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION (${expected_tag})" >&2
            exit 1
          fi

      - name: Test
        run: go test -race ./...

      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist package
          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-s -w -X github.com/hightemp/http_ssh_proxy/internal/buildinfo.Version=${GITHUB_REF_NAME} -X github.com/hightemp/http_ssh_proxy/internal/buildinfo.Commit=${GITHUB_SHA} -X github.com/hightemp/http_ssh_proxy/internal/buildinfo.BuildTime=${build_time}"
          targets=(
            "linux amd64"
            "linux arm64"
            "linux arm 7"
            "windows amd64"
            "windows arm64"
            "darwin amd64"
            "darwin arm64"
          )

          for target in "${targets[@]}"; do
            read -r goos goarch goarm <<< "${target}"
            arch_label="${goarch}"
            binary_name="http_ssh_proxy"
            build_env=(env CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}")

            if [[ -n "${goarm:-}" ]]; then
              arch_label="armv${goarm}"
              build_env+=(GOARM="${goarm}")
            fi
            if [[ "${goos}" == "windows" ]]; then
              binary_name+=".exe"
            fi

            package_name="http_ssh_proxy_${GITHUB_REF_NAME}_${goos}_${arch_label}"
            package_dir="package/${package_name}"
            mkdir -p "${package_dir}"

            "${build_env[@]}" go build \
              -trimpath \
              -ldflags="${ldflags}" \
              -o "${package_dir}/${binary_name}" \
              ./cmd/http_ssh_proxy
            cp README.md LICENSE VERSION config.example.yaml "${package_dir}/"

            if [[ "${goos}" == "windows" ]]; then
              (
                cd package
                zip -qr "../dist/${package_name}.zip" "${package_name}"
              )
            else
              tar -C package -czf "dist/${package_name}.tar.gz" "${package_name}"
            fi

            rm -rf -- "${package_dir}"
          done

          (
            cd dist
            sha256sum -- ./*.tar.gz ./*.zip > artifact-checksums.txt
          )

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: dist/http_ssh_proxy_${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Write release checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd dist
            sha256sum -- ./*.tar.gz ./*.zip ./*.spdx.json > checksums.txt
          )

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/artifact-checksums.txt

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/artifact-checksums.txt
          sbom-path: dist/http_ssh_proxy_${{ github.ref_name }}.spdx.json

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
            gh release edit "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}"
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --verify-tag \
              --generate-notes \
              --title "${GITHUB_REF_NAME}"
          fi

  docker:
    name: Publish container image
    needs: native-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Verify tag and version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ "${version}" == v* ]]; then
            expected_tag="${version}"
          else
            expected_tag="v${version}"
          fi
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION (${expected_tag})" >&2
            exit 1
          fi
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push multi-platform image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.version.outputs.build_time }}
          provenance: mode=max
          sbom: true

      - name: Smoke-test published image
        shell: bash
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          output="$(docker run --rm "${IMAGE}@${DIGEST}" -version)"
          printf '%s\n' "${output}"
          grep -F "version=${GITHUB_REF_NAME}" <<< "${output}"
          grep -F "commit=${GITHUB_SHA}" <<< "${output}"

      - name: Attest image build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
