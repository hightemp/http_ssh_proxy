name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COVERAGE_MINIMUM: "90"

jobs:
  verify:
    name: Test, modules, and vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download and verify modules
        run: |
          go mod download
          go mod verify
          go mod tidy -diff
          go list -mod=readonly -deps ./... >/dev/null

      - name: Test with race detector and coverage
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...

      - name: Vet
        run: go vet ./...

      - name: Enforce coverage threshold
        shell: bash
        run: |
          set -euo pipefail
          coverage="$(go tool cover -func=coverage.out | awk '/^total:/ { gsub("%", "", $3); print $3 }')"
          awk -v actual="${coverage}" -v minimum="${COVERAGE_MINIMUM}" 'BEGIN {
            if (actual + 0 < minimum + 0) {
              printf "Coverage %.1f%% is below required %.1f%%\n", actual, minimum > "/dev/stderr"
              exit 1
            }
            printf "Coverage %.1f%% meets required %.1f%%\n", actual, minimum
          }'

      - name: Smoke-test fuzz targets
        run: |
          go test ./internal/proxy -run='^$' -fuzz=FuzzParseBasicProxyAuthorization -fuzztime=5s
          go test ./internal/proxy -run='^$' -fuzz=FuzzRemoveHopByHopHeaders -fuzztime=5s

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan reachable vulnerabilities
        run: govulncheck ./...

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build all platforms
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build native image for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: http_ssh_proxy:ci
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
          cache-from: type=gha

      - name: Smoke-test image
        shell: bash
        run: |
          set -euo pipefail
          output="$(docker run --rm http_ssh_proxy:ci -version)"
          printf '%s\n' "${output}"
          grep -F "version=ci" <<< "${output}"
          grep -F "commit=${GITHUB_SHA}" <<< "${output}"
          test "$(docker inspect http_ssh_proxy:ci --format '{{.Config.User}}')" = "nonroot:nonroot"
